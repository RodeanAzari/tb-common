[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "tb-common"
version = "0.2.0"
description = "Project-agnostic cocotb helpers: AXI-Stream driver/monitor, in-order scoreboard, seeded random, coverage merge"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
dependencies = ["cocotb>=2.0,<3"]

[project.optional-dependencies]
coverage = ["cocotb-coverage>=2.0,<3"]  # tb_common.coverage.snapshot/export only

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
