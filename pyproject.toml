[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tb-common"
version = "0.1.0"
description = "Project-agnostic cocotb helpers: AXI-Stream driver/monitor, in-order scoreboard, seeded random"
requires-python = ">=3.11"
dependencies = ["cocotb>=2.0,<3"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
